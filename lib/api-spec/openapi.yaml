openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ScreenFlow API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: videos
    description: Video management
  - name: teams
    description: Team management
  - name: subscriptions
    description: Subscription management
  - name: stats
    description: Platform statistics
  - name: admin
    description: Admin-only operations
  - name: presence
    description: Presence and real-user monitoring
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get public platform stats
      security: []
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get admin overview (signups, online users, performance, web vitals)
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - requires admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /presence:
    post:
      operationId: reportPresence
      tags: [presence]
      summary: Report a presence heartbeat (authenticated or anonymous visitor)
      security: []
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rum:
    post:
      operationId: reportWebVital
      tags: [presence]
      summary: Report a web performance metric (Core Web Vitals)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RumRequest"
      responses:
        "200":
          description: Metric recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Not authenticated

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List user's videos
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoListResponse"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Create a video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoRequest"
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoResponse"

  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoResponse"
        "404":
          description: Video not found
    patch:
      operationId: updateVideo
      tags: [videos]
      summary: Update a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoRequest"
      responses:
        "200":
          description: Video updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoResponse"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /teams:
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
    get:
      operationId: listTeams
      tags: [teams]
      summary: List user's teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get team details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team details with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetailResponse"

  /teams/{id}/members:
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a member to a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "200":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberResponse"

  /teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member from a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get current user's subscription
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
    put:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        "200":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    StatsResponse:
      type: object
      properties:
        activeUsers:
          type: integer
        videosCreated:
          type: integer
        appStoreRating:
          type: number
        countries:
          type: integer
      required:
        - activeUsers
        - videosCreated
        - appStoreRating
        - countries

    AuthProvider:
      type: string
      enum: [email, google, github, microsoft]

    ProviderCounts:
      type: object
      properties:
        email:
          type: integer
        google:
          type: integer
        github:
          type: integer
        microsoft:
          type: integer
      required:
        - email
        - google
        - github
        - microsoft

    DailySignups:
      type: object
      properties:
        date:
          type: string
          format: date
        email:
          type: integer
        google:
          type: integer
        github:
          type: integer
        microsoft:
          type: integer
        total:
          type: integer
      required:
        - date
        - email
        - google
        - github
        - microsoft
        - total

    SignupStats:
      type: object
      properties:
        total:
          type: integer
        providers:
          $ref: "#/components/schemas/ProviderCounts"
        today:
          type: integer
        last7d:
          type: integer
        last30d:
          type: integer
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailySignups"
      required:
        - total
        - providers
        - today
        - last7d
        - last30d
        - daily

    OnlineUsers:
      type: object
      properties:
        current:
          type: integer
        authenticated:
          type: integer
        anonymous:
          type: integer
        windowMinutes:
          type: integer
      required:
        - current
        - authenticated
        - anonymous
        - windowMinutes

    PerformanceMetrics:
      type: object
      properties:
        uptimeSeconds:
          type: integer
        requestsTotal:
          type: integer
        requestsPerMinute:
          type: number
        errorRate:
          type: number
        avgLatencyMs:
          type: number
        p95LatencyMs:
          type: number
        p99LatencyMs:
          type: number
        dbStatus:
          type: string
          enum: [ok, error]
        dbPingMs:
          type: number
        memoryMb:
          type: number
      required:
        - uptimeSeconds
        - requestsTotal
        - requestsPerMinute
        - errorRate
        - avgLatencyMs
        - p95LatencyMs
        - p99LatencyMs
        - dbStatus
        - dbPingMs
        - memoryMb

    VitalsMetric:
      type: object
      properties:
        avg:
          type: number
        p75:
          type: number
      required:
        - avg
        - p75

    VitalsSummary:
      type: object
      properties:
        lcp:
          $ref: "#/components/schemas/VitalsMetric"
        cls:
          $ref: "#/components/schemas/VitalsMetric"
        inp:
          $ref: "#/components/schemas/VitalsMetric"
        sampleCount:
          type: integer
      required:
        - lcp
        - cls
        - inp
        - sampleCount

    AdminOverviewResponse:
      type: object
      properties:
        signups:
          $ref: "#/components/schemas/SignupStats"
        onlineUsers:
          $ref: "#/components/schemas/OnlineUsers"
        performance:
          $ref: "#/components/schemas/PerformanceMetrics"
        webVitals:
          $ref: "#/components/schemas/VitalsSummary"
      required:
        - signups
        - onlineUsers
        - performance
        - webVitals

    RumRequest:
      type: object
      properties:
        type:
          type: string
          enum: [lcp, cls, inp, fcp, ttfb]
        value:
          type: number
        rating:
          type: string
          enum: [good, needs-improvement, poor]
        path:
          type: string
          maxLength: 500
      required:
        - type
        - value
        - rating

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        name:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - email
        - name
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: "Session token. Use as Authorization: Bearer <token> for cross-origin clients (e.g. the recorder app). Also set as an httpOnly session cookie for same-origin browser use."
      required:
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - createdAt

    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    CreateVideoRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        fileUrl:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: number
          minimum: 0
        fileSize:
          type: integer
          minimum: 0
        resolution:
          type: string
          maxLength: 50
        status:
          type: string
          maxLength: 50
      required:
        - title

    UpdateVideoRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum: [private, public, team]

    Video:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        fileUrl:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        duration:
          type: number
          nullable: true
        resolution:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        status:
          type: string
        visibility:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - status
        - visibility
        - createdAt
        - updatedAt

    VideoResponse:
      type: object
      properties:
        video:
          $ref: "#/components/schemas/Video"
      required:
        - video

    VideoListResponse:
      type: object
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer
      required:
        - videos
        - total

    CreateTeamRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
      required:
        - name

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        ownerId:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - ownerId
        - createdAt

    TeamResponse:
      type: object
      properties:
        team:
          $ref: "#/components/schemas/Team"
      required:
        - team

    TeamListResponse:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
      required:
        - teams

    TeamDetailResponse:
      type: object
      properties:
        team:
          $ref: "#/components/schemas/Team"
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
      required:
        - team
        - members

    TeamMember:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        teamId:
          type: integer
        role:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - id
        - userId
        - teamId
        - role

    TeamMemberResponse:
      type: object
      properties:
        member:
          $ref: "#/components/schemas/TeamMember"
      required:
        - member

    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
      required:
        - email

    Subscription:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        teamId:
          type: integer
          nullable: true
        plan:
          type: string
          enum: [free, pro, team]
        status:
          type: string
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - userId
        - plan
        - status
        - currentPeriodStart

    SubscriptionResponse:
      type: object
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
      required:
        - subscription

    UpdateSubscriptionRequest:
      type: object
      properties:
        plan:
          type: string
          enum: [free, pro, team]
      required:
        - plan
